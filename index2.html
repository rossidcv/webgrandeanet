<body>

    <div class="idiomas"> 
        <select id="lang-selector"> 
            <option class="espanol" value="esp">Español</option> 
            <option class="ingles" value="eng">English</option>
            <option class="italiano" value="ita">Italiano</option>  
        </select> 
    </div>

    <!-- Títulos dinámicos -->
    <h1 class="esp">Agustín Palisa - Desarrollador Web</h1> 
    <h1 class="eng">Agustín Palisa - Web Developer</h1>
    <h1 class="ita">Agustín Palisa - Sviluppatore web</h1>

    <script>
        const selector = document.getElementById('lang-selector');
        const elementosEsp = document.querySelectorAll('.esp');
        const elementosEng = document.querySelectorAll('.eng');
        const elementosIta = document.querySelectorAll('.ita');

       selector.addEventListener('change', (e) => {
            const idioma = e.target.value;

            if (idioma === 'eng') {
                // Mostrar Inglés
                elementosEsp.forEach(el => el.style.display = 'none');
                elementosIta.forEach(el => el.style.display = 'none');
                elementosEng.forEach(el => el.style.display = 'block');
            } else if (idioma === 'ita') {
                // Mostrar Italiano
                elementosEsp.forEach(el => el.style.display = 'none');
                elementosEng.forEach(el => el.style.display = 'none');
                elementosIta.forEach(el => el.style.display = 'block');
            } else {
                // Mostrar Español por defecto (cuando valor sea 'esp')
                elementosEsp.forEach(el => el.style.display = 'block');
                elementosEng.forEach(el => el.style.display = 'none');
                elementosIta.forEach(el => el.style.display = 'none');
            }
        });

    </script>

</body>
